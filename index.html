function refill(){
  const pool=JOKES.filter(j=>!sel.value||j.category===sel.value);
  for(let i=pool.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[pool[i],pool[k]]=[pool[k],pool[i]];}
  if(cur&&pool.length>1&&pool[pool.length-1]===cur)pool.unshift(pool.pop());
  deck=pool;
}
function next(){
  if(!deck.length)refill();
  cur=deck.pop();shown=false;heard++;
  tag.textContent=cur.category;
  setup.textContent=cur.setup;
  setup.classList.toggle("code",cur.setup.includes("\n"));
  punch.hidden=true;punch.classList.remove("slam");
  reveal.disabled=false;reveal.textContent="Drop the punchline";
  card.classList.remove("swap");void card.offsetWidth;card.classList.add("swap");
  $("count").textContent="Jokes heard this session: "+heard;
}
function show(){
  if(shown)return;shown=true;
  punch.textContent=cur.punchline;punch.hidden=false;
  punch.classList.remove("slam");void punch.offsetWidth;punch.classList.add("slam");
  reveal.disabled=true;reveal.textContent="Punchline dropped";
}
reveal.onclick=show;
$("next").onclick=next;
sel.onchange=()=>{deck=[];next();};
$("copy").onclick=async e=>{
  const t=cur.setup+"\n"+cur.punchline;
  try{await navigator.clipboard.writeText(t);e.target.textContent="Copied!";}catch(_){e.target.textContent="Copy failed";}
  setTimeout(()=>e.target.textContent="Copy",1400);
};
$("theme").onclick=()=>{
  const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;
  r.dataset.theme=dark?"light":"dark";
};
document.addEventListener("keydown",e=>{
  if(e.target.closest("select,button")&&e.code==="Space")return;
  if(e.code==="Space"){e.preventDefault();shown?next():show();}
});
next();
</script>
</body>
</html>
